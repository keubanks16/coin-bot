name = "phantom-alt-bot"
main = "src/index.js"
compatibility_date = "2026-10-01"

# The cron fires every minute and keeps the fast loop (the FastMonitor Durable Object) alive.
# FastMonitor re-checks positions every TICK_SECONDS and scans for entries every SCAN_EVERY_SEC.
[triggers]
crons = ["* * * * *"]

# Same class and migration the bot already runs on Cloudflare, so redeploys never recreate it.
[[durable_objects.bindings]]
name = "FAST_MONITOR"
class_name = "FastMonitor"

[[migrations]]
tag = "fast-monitor-v1"
new_sqlite_classes = ["FastMonitor"]

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "phantom-alt-bot"
database_id = "96bb9edb-44e5-453a-a54f-74dea3cd4960"

[vars]
# Paper trading until you flip this to "true" and redeploy.
LIVE_TRADING = "false"
PAPER_START_USD = "1000"

# "pump" (snipe brand-new pump.fun coins, paper only), "scalp" (fast in-and-out on established
# coins) or "momentum" (the original slower 1h swing strategy).
STRATEGY = "pump"

# Pump.fun sniper (only used when STRATEGY = "pump"; full list in src/strategy.js)
PUMP_TRADE_USD = "20"
PUMP_DAILY_LOSS_LIMIT_PCT = "0.2"
PUMP_MAX_POSITIONS = "5"
PUMP_POLL_SECONDS = "2"
PUMP_MAX_AGE_SEC = "180"
PUMP_MIN_INFLOW_SOL = "2"
PUMP_MAX_MCAP_SOL = "120"
PUMP_MAX_DEV_PCT = "10"
PUMP_REQUIRE_SOCIALS = "1"
PUMP_TAKE_PROFIT_USD = "5"
PUMP_STOP_LOSS_PCT = "0.25"
PUMP_TRAIL_ARM_PCT = "0.05"
PUMP_DOWNTURN_PCT = "0.12"
PUMP_STALL_SEC = "45"
PUMP_MAX_HOLD_MIN = "10"

# Graduated coins (src/grad.js): runs next to the sniper in pump mode. Paper only.
GRAD_ENABLED = "1"
GRAD_TRADE_USD = "20"
GRAD_MAX_POSITIONS = "3"
GRAD_MIN_WAIT_SEC = "60"
GRAD_MAX_AGE_MIN = "15"
GRAD_MIN_INFLOW_SOL = "3"
GRAD_TAKE_PROFIT_USD = "5"
GRAD_STOP_LOSS_PCT = "0.15"

# Learning (src/learn.js): after this many finished lessons (real trades + coins it followed
# without buying), it only buys setups it expects to return more than LEARN_MIN_EDGE_PCT.
LEARN_MIN_LESSONS = "30"
LEARN_MIN_EDGE_PCT = "0"
PUMP_MAX_SHADOWS = "40"

# Speed. The free Jupiter key allows 1 request/sec, so these are tuned to stay inside it.
# If you upgrade your Jupiter key, raise JUP_RPS (e.g. "10") and you can lower the others.
TICK_SECONDS = "5"
SCAN_EVERY_SEC = "30"
JUP_RPS = "1"

# Sizing and risk
POSITION_PCT = "0.15"
MAX_POSITIONS = "4"
MAX_TRADE_USD = "250"
DAILY_LOSS_LIMIT_PCT = "0.06"
LOSS_STREAK_LIMIT = "4"
LOSS_STREAK_PAUSE_MIN = "60"

# Scalp exits (sold on whichever comes first)
STOP_LOSS_PCT = "0.025"
TAKE_PROFIT_PCT = "0.04"
TRAIL_ARM_PCT = "0.015"
TRAIL_PCT = "0.01"
STALE_MINUTES = "15"
MAX_HOLD_HOURS = "1"

# Only trade tokens cheap enough to scalp: buying and selling right back must cost <= 0.6%.
MAX_ROUNDTRIP_COST_PCT = "0.006"

# Recommended for pump mode (it reads the chain every 2 seconds): a free Helius RPC URL.
# Optional: a paid/dedicated RPC is more reliable than the public one in live mode
# SOLANA_RPC_URL = "https://mainnet.helius-rpc.com/?api-key=..."

# Secrets (set with `npx wrangler secret put NAME`, never put them in this file):
#   DASHBOARD_PASSWORD   - password for the dashboard
#   JUPITER_API_KEY      - free key from https://developers.jup.ag/portal
#   WALLET_PRIVATE_KEY   - only needed for live mode (Phantom > Show Private Key)
